<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan - the idle scanner</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="../shared/proto.css">
<script src="../shared/proto-theme.js" defer></script>
</head>
<body>

<!-- shell: Scan tab = the FULL-SCREEN scanner, and a scanned product arrives as a bottom sheet over the video (shell-contract.md line 16). The flat four-slot bar stays on it, because Scan is a TAB and not a modal (same file, the block CLOSED 2026-08-18) - so the camera fills everything above the bar and nothing else. -->

<div class="app full">

  <div class="scan">
    <!-- ⛔ no Clear / Compare chips here: they appear only once something has been scanned
         (scan_header.dart, and frame t067 has none while t108 onwards do) -->
    <div class="ctop">
      <span class="spacer"></span>
      <a class="cbtn" href="../07-search/search-entry.html" title="Enter the Barcode">&#9000;</a>
      <span class="cbtn" title="Toggle camera">&#8646;</span>
      <span class="cbtn" title="Toggle torch">&#9788;</span>
    </div>

    <div class="reticle"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span class="glyph">&#9906;</span></div>

    <!-- `HomePageScannerMessageOverlay` with `homepage_scanner_banner_start_scanning` - both
         shipped, and this is the English of the sentence on their own artboards 20 / 21 / 28.
         ⭐ The whole `homepage_scanner_*` string family exists because OFF already built a
         full-bleed scanner behind `__homePageV2`; it is translated into 128 locales. -->
    <div class="hint">
      <span class="i">&#9432;</span>
      <span class="t">Scan a product by approaching its barcode</span>
    </div>
  </div>

  <div class="tabbar">
    <a href="../03-home/home-app.html"><span class="g">&#9750;</span>Home</a>
    <a class="on"><span class="g">&#9678;</span>Scan</a>
    <a href="../08-lists/lists-history.html"><span class="g">&#9782;</span>Lists</a>
    <a href="../04-profile/profile-in.html"><span class="g">&#9787;</span>Profile</a>
  </div>

</div>

</body>
</html>
