<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quit without saving? - the shipped guard, as a sheet</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="../shared/proto.css">
<script src="../shared/proto-theme.js" defer></script>
<script src="../shared/proto-nav.js" defer></script>
</head>
<body>

<div class="app">

  <div class="dim">
    <div class="sbar">
      <span class="back">&#8592;</span>
      <h1>Nutrition Facts</h1>
    </div>

    <div class="pident">
      <span class="ph"><img src="https://images.openfoodfacts.org/images/products/380/020/587/2962/front_en.3.400.jpg" alt="Bruschette chips pizza front photo"></span>
      <span class="t">
        <b>Bruschette chips pizza</b>
        <i>Maretti</i>
        <code>3800205872962</code>
      </span>
    </div>

    <div class="pcard2">
      <h3>Nutrition facts</h3>
      <div class="perrow">
        <span class="t">Nutritional values:</span>
        <span class="sel">per 100g <span class="g">&#9662;</span></span>
      </div>
      <div class="nrow">
        <span class="nm">Energy (kJ)</span>
        <span class="fld">1906.1</span>
        <span class="unit"><span class="sel">kj</span></span>
        <span class="eye">&#128065;</span>
      </div>
      <div class="nrow">
        <span class="nm">Energy (kcal)</span>
        <span class="fld">453</span>
        <span class="unit"><span class="sel">kcal</span></span>
        <span class="eye">&#128065;</span>
      </div>
      
      <div class="nrow">
        <span class="nm">Salt</span>
        <span class="fld empty">&#8212;</span>
        <span class="unit"><span class="sel">g <span class="g">&#9662;</span></span></span>
        <span class="eye">&#128065;</span>
      </div>
    </div>
  </div>

  <div class="sheet">
    <div class="grab"><span class="bar"></span></div>
    <div class="shd"><i></i><h2>Quit without saving?</h2><span class="spacer"></span></div>
    <div class="sbody">
      <p class="sq">Do you want to save your changes before leaving this page?</p>
      <a class="srow2" href="edit-nutrition.html"><span class="t"><b>Save changes</b></span></a>
      <a class="srow2 drop" href="edit-hub.html"><span class="t"><b>Discard changes</b></span></a>
    </div>
  </div>

</div>

</body>
</html>
