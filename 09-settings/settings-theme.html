<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Settings - the Theme sheet</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="../shared/proto.css">
<script src="../shared/proto-theme.js" defer></script>
</head>
<body>

<div class="app">

  <div class="dim">
    <div class="sbar">
      <span class="back">&#8592;</span>
      <h1>App Settings</h1>
      <span class="ico">&#128269;</span>
    </div>

    <div class="pcard2">
      <h3>Graphical interface</h3>
      <div class="setrow">
        <span class="pi">&#127912;</span>
        <span class="t"><b>Theme</b><span class="val">System default</span></span>
        <span class="go2">&rsaquo;</span>
      </div>
    </div>

    <div class="pcard2">
      <h3>Application</h3>
      <div class="setrow">
        <span class="pi">&#127760;</span>
        <span class="t"><b>Your language</b><span class="val">English (English)</span></span>
        <span class="go2">&rsaquo;</span>
      </div>
      <div class="setrow">
        <span class="pi">&#128205;</span>
        <span class="t"><b>Your country</b><span class="val">United States</span></span>
        <span class="go2">&rsaquo;</span>
      </div>
    </div>
  </div>

  <div class="sheet">
    <div class="grab"><span class="bar"></span></div>
    <div class="shd"><i></i><h2>Theme</h2><span class="spacer"></span></div>
    <a class="srow on" href="settings-app.html"><span class="g">&#9788;</span><span class="t"><b>System default</b></span><span class="n">&#10003;</span></a>
    <a class="srow" href="settings-app.html"><span class="g">&#9728;</span><span class="t"><b>Light</b></span></a>
    <a class="srow" href="settings-app.html"><span class="g">&#9790;</span><span class="t"><b>Dark</b></span></a>
    <a class="srow" href="settings-app.html"><span class="g">&#9899;</span><span class="t"><b>AMOLED</b></span></a>
  </div>

</div>

</body>
</html>
