<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A search that matched nothing</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="../shared/proto.css">
<script src="../shared/proto-theme.js" defer></script>
<script src="../shared/proto-nav.js" defer></script>
</head>
<body>

<div class="webbar">
  <span class="logo" role="img" aria-label="Open Food Facts" data-href="../03-home/home-web.html" title="Home"></span>
  <span class="field">
    <span class="q">zzzzqwertynonexistentterm</span>
    <span class="go">&#9906;</span>
  </span>
  <span class="spacer"></span>
  <a class="btn todo" title="Family 7 is the app scanner; the web scanner is not drawn">Scan barcode</a>
</div>

<div class="appbar">
  <a class="ico" href="../07-search/search-results.html">&#8592;</a>
  <span class="field">
    <span class="q">zzzzqwertynonexistentterm</span>
    <span class="go">&#9906;</span>
  </span>
</div>

<div class="wrap">

  <div class="wstate">
    <div class="state">
      <div class="art">&#9906;</div>
      <h2>No products found</h2>
      <p>We couldn&rsquo;t find any products matching your search</p>
      
      <div class="acts">
        <a class="btnpeach" href="../07-search/search-entry.html">Change search criteria</a>
      </div>
    </div>
  </div>

</div>

</body>
</html>
